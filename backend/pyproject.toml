[project]
name = "insidethegame-backend"
version = "0.1.0"
description = "Synthetic match generator, replay engine, analytics plugins and multi-agent narration"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "numpy>=2.0",
    "httpx>=0.27",
    "agent-framework-core>=1.22",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
